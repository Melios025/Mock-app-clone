<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bếp Nhà — Chọn món</title>
  <style>
    :root {
      --green: #00b14f;
      --green-dark: #00913f;
      --green-light: #e6f9ee;
      --ink: #1a1a1a;
      --gray: #6b7280;
      --line: #eceef0;
      --bg: #f5f6f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 100px;
    }

    header {
      background: var(--green);
      color: #fff;
      padding: 16px 16px 56px;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .backbtn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      text-decoration: none;
      color: #fff;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      opacity: .9;
    }

    .hero-card {
      background: #fff;
      border-radius: 16px;
      margin: -40px 12px 0;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
      position: relative;
      z-index: 2;
    }

    .shop-name {
      font-size: 19px;
      font-weight: 800;
    }

    .shop-meta {
      color: var(--gray);
      font-size: 13px;
      margin-top: 4px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gray);
      display: inline-block;
    }

    .badge-qa {
      display: inline-block;
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      background: #fff3e0;
      color: #b45309;
      border: 1px dashed #f0b74a;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: .3px;
    }

    .section-title {
      padding: 20px 16px 8px;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
    }

    .list {
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
      border: 1px solid var(--line);
    }

    .item-img {
      width: 68px;
      height: 68px;
      min-width: 68px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fff4e8, #ffe4d6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.3;
    }

    .item-price {
      font-size: 13.5px;
      color: var(--gray);
      margin-top: 3px;
      font-weight: 600;
    }

    .item-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--green-dark);
      background: var(--green-light);
      padding: 2px 7px;
      border-radius: 5px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 96px;
      justify-content: flex-end;
    }

    .addbtn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      border: none;
      font-size: 20px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 177, 79, .35);
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1.5px solid var(--green);
      border-radius: 20px;
      padding: 2px 4px;
    }

    .stepper button {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: var(--green);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stepper button.minus {
      background: #fff;
      color: var(--green);
      border: 1.5px solid var(--green);
    }

    .stepper .qty-num {
      font-size: 14px;
      font-weight: 800;
      min-width: 16px;
      text-align: center;
    }

    .cartbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--green);
      color: #fff;
      padding: 14px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, .15);
    }

    .cartbar.show {
      display: flex;
    }

    .cartbar-left {
      font-size: 13px;
      opacity: .92;
    }

    .cartbar-count {
      font-weight: 800;
      font-size: 15px;
    }

    .cartbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14.5px;
      background: rgba(255, 255, 255, .15);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .footer-note {
      text-align: center;
      color: var(--gray);
      font-size: 12px;
      padding: 22px 20px 10px;
    }
  </style>
</head>

<body>

  <header>
    <div class="topbar">
      <a class="backbtn" href="javascript:void(0)" title="Màn hình demo — không có màn trước">←</a>
      <div class="topbar-title">Giả lập chọn món</div>
    </div>
  </header>

  <div class="hero-card">
    <div class="shop-name">Bếp Nhà — Quán Giả Lập</div>
    <div class="shop-meta">
      <span>⭐ 4.8</span><span class="dot"></span>
      <span>2.300 đánh giá</span><span class="dot"></span>
      <span>20–30 phút</span>
    </div>
    <div class="badge-qa">🧪 DỮ LIỆU GIẢ LẬP — DÙNG ĐỂ TEST GIỎ HÀNG &amp; MÃ GIẢM GIÁ</div>
  </div>

  <div class="section-title">Món ăn</div>
  <div class="list" id="list"></div>
  <div class="cartbar" id="cartbar">
    <div class="cartbar-left">
      <div class="cartbar-count" id="cartCount">0 món</div>
      <div id="cartTotal">0đ</div>
    </div>
    <div class="cartbar-right" id="goCheckout">
      Xem giỏ hàng →
    </div>
  </div>

  <script>
    // ----- Dữ liệu sản phẩm giả lập (phải khớp với thanh-toan.html) -----
    const PRODUCTS = [
      { id: 'p1', name: 'Cơm gà xối mỡ', price: 45000, emoji: '🍗', couponEligible: true },
      { id: 'p2', name: 'Bún bò Huế', price: 55000, emoji: '🍜', couponEligible: true },
      { id: 'p3', name: 'Phở bò tái', price: 50000, emoji: '🍲', couponEligible: true },
      { id: 'p4', name: 'Bánh mì thịt nướng', price: 25000, emoji: '🥖', couponEligible: true },
      { id: 'p5', name: 'Trà sữa trân châu', price: 35000, emoji: '🧋', couponEligible: true },
      { id: 'p6', name: 'Gỏi cuốn tôm thịt', price: 40000, emoji: '🥗', couponEligible: true },
      { id: 'p7', name: 'Cơm tấm sườn bì chả', price: 48000, emoji: '🍛', couponEligible: true },
      { id: 'p8', name: 'Chè khúc bạch', price: 30000, emoji: '🍧', couponEligible: true },
      { id: 'p9', name: 'Nước cam ép', price: 28000, emoji: '🍊', couponEligible: true },
      { id: 'p10', name: 'Bánh flan', price: 18000, emoji: '🍮', couponEligible: true },
    ];

    function fmt(n) { return n.toLocaleString('vi-VN') + 'đ'; }

    function encodeCart(cart) {
      try { return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(cart))))); }
      catch (e) { return ''; }
    }
    function decodeCart(str) {
      try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(str))))); }
      catch (e) { return {}; }
    }

    // Đọc giỏ hàng hiện có từ URL (nếu quay lại từ trang thanh toán)
    const params = new URLSearchParams(window.location.search);
    let cart = {};
    if (params.get('cart')) {
      cart = decodeCart(params.get('cart')) || {};
    }

    const listEl = document.getElementById('list');

    function render() {
      listEl.innerHTML = '';
      PRODUCTS.forEach(p => {
        const qty = cart[p.id] || 0;
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
      <div class="item-img">${p.emoji}</div>
      <div class="item-info">
        <div class="item-name">${p.name}</div>
        <div class="item-price">${fmt(p.price)}</div>
      </div>
      <div class="qty-control" id="qc-${p.id}"></div>
    `;
        listEl.appendChild(card);
        renderQtyControl(p, qty);
      });
      renderCartbar();
    }

    function renderQtyControl(p, qty) {
      const el = document.getElementById(`qc-${p.id}`);
      if (qty <= 0) {
        el.innerHTML = `<button class="addbtn" onclick="changeQty('${p.id}',1)">+</button>`;
      } else {
        el.innerHTML = `
      <div class="stepper">
        <button class="minus" onclick="changeQty('${p.id}',-1)">−</button>
        <div class="qty-num">${qty}</div>
        <button onclick="changeQty('${p.id}',1)">+</button>
      </div>`;
      }
    }

    function changeQty(id, delta) {
      const cur = cart[id] || 0;
      const next = Math.max(0, cur + delta);
      if (next === 0) { delete cart[id]; } else { cart[id] = next; }
      render();
    }

    function renderCartbar() {
      const bar = document.getElementById('cartbar');
      let count = 0, total = 0;
      Object.keys(cart).forEach(id => {
        const p = PRODUCTS.find(x => x.id === id);
        if (!p) return;
        count += cart[id];
        total += cart[id] * p.price;
      });
      if (count > 0) {
        bar.classList.add('show');
        document.getElementById('cartCount').textContent = `${count} món`;
        document.getElementById('cartTotal').textContent = fmt(total);
      } else {
        bar.classList.remove('show');
      }
    }

    document.getElementById('goCheckout').addEventListener('click', () => {
      const encoded = encodeCart(cart);
      window.location.href = `thanh-toan.html?cart=${encoded}`;
    });

    render();
  </script>
</body>

</html>
